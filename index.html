<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>頌主堂・讀經心得分享</title>
    <!-- Tailwind CSS 3.4.15 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        morandi: {
                            bg: '#F2F1EC',       // 莫蘭迪暖灰白
                            card: '#FAF9F6',     // 莫蘭迪絲絹白
                            text: '#2C3033',     // 深霧灰黑
                            muted: '#7A828A',    // 莫蘭迪中灰
                            blue: '#8EA4B1',     // 莫蘭迪煙燻藍
                            sage: '#9CAF9A',     // 莫蘭迪鼠尾草綠
                            rose: '#C0A39E',     // 莫蘭迪霧粉
                            ochre: '#C4B097',    // 莫蘭迪暖燕麥
                            slate: '#606B73',    // 石板青
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');

        body {
            background-color: #F2F1EC;
            color: #2C3033;
            font-family: 'Noto Sans TC', sans-serif;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #F2F1EC; }
        ::-webkit-scrollbar-thumb { background: #C4B097; border-radius: 4px; }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-morandi-blue/20">

    <!-- 頂部導覽列 -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-morandi-bg/85 border-b border-stone-300/40 py-5 px-6 transition-all duration-300">
        <div class="max-w-4xl mx-auto">
            <div class="flex items-center gap-2">
                <span class="inline-block w-2.5 h-2.5 rounded-full bg-morandi-sage"></span>
                <h1 class="text-2xl font-semibold tracking-wider text-morandi-text">頌主堂讀經心得分享</h1>
            </div>
            <p class="text-sm text-morandi-muted mt-1 tracking-wide font-light">在神的話語中彼此鼓勵，一同成長。</p>
        </div>
    </header>

    <!-- 主要內容：文章列表 -->
    <main class="flex-grow max-w-4xl mx-auto w-full px-6 py-10">

        <h2 class="text-lg md:text-xl font-semibold text-morandi-text mb-6 tracking-wide">所有分享</h2>

        <div class="space-y-6">

            <!-- 文章 1 -->
            <a href="blog/2026-06-10-reading-notes.html"
               class="block bg-morandi-card border-l-4 border-morandi-blue rounded-r-2xl rounded-l-md p-7 md:p-9 shadow-[0_4px_20px_rgba(0,0,0,0.02)] hover:shadow-md transition-all duration-300 group">
                <div class="flex items-center gap-2 mb-3">
                    <span class="px-3 py-1 rounded-full text-xs font-semibold bg-morandi-sage/20 text-morandi-sage">讀經心得</span>
                    <span class="text-sm text-morandi-muted">2026-06-10</span>
                </div>
                <h3 class="text-xl md:text-2xl font-bold text-morandi-text tracking-wide group-hover:text-morandi-blue transition-colors">
                    讀經心得分享集
                </h3>
                <p class="mt-3 text-base md:text-lg text-morandi-muted leading-relaxed font-light">
                    收錄弟兄姊妹們在創世記、出埃及記、列王紀下、歷代志等書卷的每日讀經領受與感動。
                </p>
                <span class="inline-flex items-center gap-1 mt-5 text-sm md:text-base font-medium text-morandi-blue">
                    閱讀全文
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </span>
            </a>

            <!-- 未來新增的文章，請依上方格式複製一個 <a> 區塊，並把 href 指向 blog/ 內的新檔案 -->

        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="max-w-4xl mx-auto w-full px-6 py-12 border-t border-stone-300/30 text-center">
        <p class="text-xs text-morandi-muted tracking-widest font-light">「祢的話是我腳前的燈，是我路上的光。」— 詩篇 119:105</p>
    </footer>

</body>
</html>
