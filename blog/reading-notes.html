<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 不送 Referer：百度語音端點帶 referer 時會回傳空音檔 -->
    <meta name="referrer" content="no-referrer">
    <title>頌主堂・讀經心得分享</title>
    <!-- Tailwind CSS 3.4.15 CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        morandi: {
                            bg: '#F2F1EC',       // 莫蘭迪暖灰白
                            card: '#FAF9F6',     // 莫蘭迪絲絹白
                            text: '#2C3033',     // 深霧灰黑
                            muted: '#7A828A',    // 莫蘭迪中灰
                            blue: '#8EA4B1',     // 莫蘭迪煙燻藍
                            sage: '#9CAF9A',     // 莫蘭迪鼠尾草綠
                            rose: '#C0A39E',     // 莫蘭迪霧粉
                            ochre: '#C4B097',    // 莫蘭迪暖燕麥
                            slate: '#606B73',    // 石板青
                            plum: '#A88C93',     // 莫蘭迪紫棕 (主日講道)
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;700&family=Noto+Sans+TC:wght@300;400;500;700&display=swap');
        
        body {
            background-color: #F2F1EC;
            color: #2C3033;
            font-family: 'Noto Sans TC', sans-serif;
        }

        /* 優雅的淡入淡出動畫 */
        .card-transition {
            transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        /* 自訂滾動條 */
        ::-webkit-scrollbar {
            width: 8px;
        }
        ::-webkit-scrollbar-track {
            background: #F2F1EC;
        }
        ::-webkit-scrollbar-thumb {
            background: #C4B097;
            border-radius: 4px;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col antialiased selection:bg-morandi-blue/20">

    <!-- 頂部導覽列 (現代極簡設計) -->
    <header class="sticky top-0 z-50 backdrop-blur-md bg-morandi-bg/85 border-b border-stone-300/40 py-5 px-6 transition-all duration-300">
        <div class="max-w-4xl mx-auto flex flex-col md:flex-row md:items-center md:justify-between gap-6">
            
            <!-- 標題區 -->
            <div class="text-left">
                <div class="flex items-center gap-2">
                    <span class="inline-block w-2.5 h-2.5 rounded-full bg-morandi-sage"></span>
                    <h1 class="text-lg md:text-xl font-semibold tracking-wider text-morandi-text">頌主堂讀經心得分享</h1>
                </div>
                <p class="text-sm text-morandi-muted mt-1 tracking-wide font-light">頌主堂・弟兄姊妹讀經心得分享</p>
            </div>

            <!-- 控制功能區 (篩選、字級) -->
            <div class="flex flex-wrap items-center gap-4">
                
                <!-- 書卷篩選下拉選單 -->
                <div class="relative min-w-[160px]">
                    <select id="bookSelect" class="w-full appearance-none bg-morandi-card border border-stone-300/50 text-morandi-text py-2.5 px-4 pr-10 rounded-full text-sm md:text-base font-medium focus:outline-none focus:ring-2 focus:ring-morandi-blue/40 focus:border-morandi-blue cursor-pointer shadow-sm transition-all duration-300">
                        <option value="all">🔍 所有分類</option>
                    </select>
                    <div class="pointer-events-none absolute inset-y-0 right-0 flex items-center pr-4 text-morandi-muted">
                        <svg class="h-4 w-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>
                    </div>
                </div>

                <!-- 字體大小調整控制 (A- / A+) -->
                <div class="flex items-center gap-2">
                <span class="text-sm md:text-base text-morandi-muted font-medium whitespace-nowrap">調整字體</span>
                <div class="flex bg-morandi-card rounded-full border border-stone-300/50 p-1 shadow-sm items-center">
                    <button id="btnFontDec" class="w-8 h-8 flex items-center justify-center rounded-full text-stone-500 hover:bg-stone-200/50 transition-colors" title="減小字體">
                        <span class="text-xs font-bold">A-</span>
                    </button>
                    <span id="fontSizeDisplay" class="text-sm font-semibold px-2 text-morandi-muted min-w-[40px] text-center">適中</span>
                    <button id="btnFontInc" class="w-8 h-8 flex items-center justify-center rounded-full text-stone-500 hover:bg-stone-200/50 transition-colors" title="放大字體">
                        <span class="text-sm font-bold">A+</span>
                    </button>
                </div>
                </div>

                <!-- 匯出 PDF -->
                <a id="pdfExportLink" href="print.html" class="inline-flex items-center gap-2 bg-morandi-slate text-white py-2.5 px-5 rounded-full text-sm md:text-base font-semibold shadow-sm hover:bg-morandi-text transition-colors" title="將心得匯出成 PDF">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.5 14.25v-2.625a3.375 3.375 0 00-3.375-3.375h-1.5A1.125 1.125 0 0113.5 7.125v-1.5a3.375 3.375 0 00-3.375-3.375H8.25m2.25 0H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 00-9-9z"></path></svg>
                    <span>匯出 PDF</span>
                </a>
            </div>

        </div>
    </header>

    <!-- 介紹文字 -->
    <section class="max-w-4xl mx-auto w-full px-6 pt-8">
        <p class="text-base md:text-lg text-morandi-muted leading-relaxed">
            在神的話語中彼此鼓勵，一同成長。
        </p>
    </section>

    <!-- 月份選擇列 -->
    <section class="max-w-4xl mx-auto w-full px-6 pt-6">
        <div id="dateBtnRow" class="flex flex-wrap items-center gap-2 pb-4 border-b border-stone-300/30">
            <span class="text-base md:text-lg text-morandi-muted font-medium tracking-wider mr-2">選擇月份 :</span>
            <button class="date-btn px-4 py-1.5 rounded-full text-base md:text-lg font-medium bg-morandi-text text-white transition-all shadow-sm" data-date="all">全部月份</button>
        </div>
    </section>

    <!-- 快捷點選標籤列 (更直覺的分類介面) -->
    <section class="max-w-4xl mx-auto w-full px-6 pt-6">
        <div id="tagBtnRow" class="flex flex-wrap items-center gap-2 pb-4 border-b border-stone-300/30">
            <span class="text-base md:text-lg text-morandi-muted font-medium tracking-wider mr-2">快速導覽 :</span>
            <button class="tag-btn px-4 py-1.5 rounded-full text-base md:text-lg font-medium bg-morandi-blue text-white transition-all shadow-sm" data-target="all">顯示全部</button>
        </div>
    </section>

    <!-- 主要內容展示區 -->
    <main class="flex-grow max-w-4xl mx-auto w-full px-6 py-10">
        
        <!-- 一鍵複製提示框 (非 Alert 友好 UI) -->
        <div id="toastMessage" class="fixed bottom-8 right-8 z-50 bg-morandi-text text-white text-sm px-5 py-3 rounded-xl shadow-xl transform translate-y-20 opacity-0 transition-all duration-300 flex items-center gap-2">
            <svg class="w-4 h-4 text-morandi-sage" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg>
            <span id="toastText">內容已成功複製至剪貼簿</span>
        </div>

        <div id="insightsGrid" class="space-y-8">
            <!-- 空白提醒 -->
            <div id="noResults" class="hidden py-24 text-center">
                <svg class="w-16 h-16 mx-auto text-stone-300 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                <p class="text-stone-500 text-lg font-light">無此書卷的靈修心得紀錄</p>
            </div>

        </div>
    </main>

    <!-- 頁尾 -->
    <footer class="max-w-4xl mx-auto w-full px-6 py-12 border-t border-stone-300/30 text-center">
        <p class="text-sm md:text-base text-morandi-muted tracking-widest font-light">「祢的話是我腳前的燈，是我路上的光。」— 詩篇 119:105</p>
    </footer>

    <!-- 資料載入與渲染 Logic -->
    <script>
        const BADGE_OPACITY = { sage: '20', rose: '15', slate: '15', ochre: '15', blue: '10', plum: '15' };

        function escapeHtml(str) {
            return String(str).replace(/[&<>"']/g, c => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
            }[c]));
        }

        function formatDateLabel(dateStr) {
            const [y, m] = dateStr.split('-');
            return `${y}年${m}月`;
        }

        function noteCardHTML(rec) {
            const opacity = BADGE_OPACITY[rec.color] || '15';
            return `
            <article class="insight-card card-transition bg-morandi-card border-l-4 border-morandi-${rec.color} rounded-r-2xl rounded-l-md p-8 md:p-10 shadow-[0_4px_20px_rgba(0,0,0,0.02)] hover:shadow-md transition-all duration-300" data-book="${escapeHtml(rec.book)}" data-date="${rec.date}">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-stone-200/50">
                    <div class="flex items-center gap-2">
                        <span class="px-3 py-1 rounded-full text-sm md:text-base font-semibold bg-morandi-${rec.color}/${opacity} text-morandi-${rec.color}">${escapeHtml(rec.book)}</span>
                        <span class="card-title text-base md:text-lg font-bold tracking-wider text-morandi-text">${escapeHtml(rec.ref)}</span>
                    <span class="text-xs md:text-sm text-morandi-muted font-light ml-1">${formatDateLabel(rec.date)}</span>
                    </div>
                    <button class="copy-btn text-stone-400 hover:text-morandi-blue p-1 rounded-lg hover:bg-stone-100 transition-colors" title="複製此段筆記">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    </button>
                </div>
                <div class="insight-content text-morandi-text font-serif leading-relaxed text-justify whitespace-pre-line tracking-wide">${escapeHtml(rec.text)}</div>
            </article>`;
        }

        function sermonCardHTML(rec) {
            const topHtml = rec.top.map(escapeHtml).join('\n');
            let sectionsHtml = '';
            rec.sections.forEach(sec => {
                sectionsHtml += `\n                    <h3 class="text-[1.25em] font-bold text-morandi-plum mt-8 mb-3 first:mt-0">${escapeHtml(sec.heading)}</h3>`;
                if (sec.verse) {
                    sectionsHtml += `\n                    <p class="text-[0.85em] text-morandi-muted font-medium mb-3 pl-1">${escapeHtml(sec.verse)}</p>`;
                }
                sec.paragraphs.forEach(p => {
                    sectionsHtml += `\n                    <p class="mb-4 pl-1 text-justify">${escapeHtml(p)}</p>`;
                });
            });
            let prayerHtml = '';
            if (rec.prayer && rec.prayer.length) {
                prayerHtml = '\n                    <div class="mt-8 rounded-xl bg-morandi-plum/5 border border-morandi-plum/20 p-6">'
                    + '\n                    <h3 class="text-[1.25em] font-bold text-morandi-plum mt-8 mb-3 first:mt-0">結束禱告</h3>'
                    + rec.prayer.map(p => `\n                    <p class="mb-3 text-morandi-text/90 italic leading-loose">${escapeHtml(p)}</p>`).join('')
                    + '\n                    </div>';
            }
            return `
            <article class="insight-card card-transition bg-morandi-card border-l-4 border-morandi-plum rounded-r-2xl rounded-l-md p-8 md:p-10 shadow-[0_4px_20px_rgba(0,0,0,0.02)] hover:shadow-md transition-all duration-300" data-book="${escapeHtml(rec.book)}" data-date="${rec.date}">
                <div class="flex items-center justify-between mb-4 pb-3 border-b border-stone-200/50">
                    <div class="flex items-center gap-2">
                        <span class="px-3 py-1 rounded-full text-sm md:text-base font-semibold bg-morandi-plum/15 text-morandi-plum">${escapeHtml(rec.book)}</span>
                        <span class="card-title text-base md:text-lg font-bold tracking-wider text-morandi-text">${escapeHtml(rec.title)}</span>
                    <span class="text-xs md:text-sm text-morandi-muted font-light ml-1">${formatDateLabel(rec.date)}</span>
                    </div>
                    <button class="copy-btn text-stone-400 hover:text-morandi-blue p-1 rounded-lg hover:bg-stone-100 transition-colors" title="複製此段筆記">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 5H6a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2v-1M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 002 2h2a2 2 0 002-2M8 5a2 2 0 012-2h2a2 2 0 012 2m0 0h2a2 2 0 012 2v3m2 4H10m0 0l3-3m-3 3l3 3"></path></svg>
                    </button>
                </div>
                <div class="insight-content sermon-content text-morandi-text font-serif leading-relaxed tracking-wide">
                    <p class="text-[0.85em] text-morandi-muted font-medium mb-6 whitespace-pre-line border-l-2 border-morandi-plum/30 pl-4">${topHtml}</p>${sectionsHtml}${prayerHtml}
                </div>
            </article>`;
        }

        function renderPage(records) {
            const bookSelect = document.getElementById('bookSelect');
            const tagBtnRow = document.getElementById('tagBtnRow');
            const dateBtnRow = document.getElementById('dateBtnRow');
            const noResults = document.getElementById('noResults');

            const books = [];
            const bookColor = {};
            const dates = [];

            records.forEach(rec => {
                if (!books.includes(rec.book)) {
                    books.push(rec.book);
                    bookColor[rec.book] = rec.color;
                }
                if (!dates.includes(rec.date)) dates.push(rec.date);
            });

            books.forEach(b => {
                const opt = document.createElement('option');
                opt.value = b;
                opt.textContent = b;
                bookSelect.appendChild(opt);
            });

            dates.forEach(d => {
                const btn = document.createElement('button');
                btn.className = "date-btn px-4 py-1.5 rounded-full text-base md:text-lg font-medium bg-white text-morandi-muted hover:bg-morandi-text hover:text-white transition-all shadow-sm";
                btn.setAttribute('data-date', d);
                btn.textContent = formatDateLabel(d);
                dateBtnRow.appendChild(btn);
            });

            books.forEach(b => {
                const color = bookColor[b];
                const btn = document.createElement('button');
                btn.className = `tag-btn px-4 py-1.5 rounded-full text-base md:text-lg font-medium bg-white text-morandi-muted hover:bg-morandi-${color} hover:text-white transition-all shadow-sm`;
                btn.setAttribute('data-target', b);
                btn.textContent = b;
                tagBtnRow.appendChild(btn);
            });

            const cardsHtml = records.map(rec => rec.type === 'sermon' ? sermonCardHTML(rec) : noteCardHTML(rec)).join('\n');
            noResults.insertAdjacentHTML('beforebegin', cardsHtml);
        }

        async function loadAndRender() {
            try {
                const res = await fetch('reading-notes.jsonl');
                const text = await res.text();
                const records = text.split('\n').map(l => l.trim()).filter(Boolean).map(l => JSON.parse(l));
                renderPage(records);
            } catch (err) {
                console.error('讀取心得資料失敗：', err);
            }
            initPage();
        }

        document.addEventListener('DOMContentLoaded', loadAndRender);
    </script>

    <!-- 智慧交互 Logic (Vanilla JS) -->
    <script>
        function initPage() {
            const bookSelect = document.getElementById('bookSelect');
            const cards = document.querySelectorAll('.insight-card');
            const noResults = document.getElementById('noResults');
            const tagBtns = document.querySelectorAll('.tag-btn');
            const dateBtns = document.querySelectorAll('.date-btn');
            
            // --- 字級調整邏輯 (動態調整卡片內的文字大小) ---
            const fontDec = document.getElementById('btnFontDec');
            const fontInc = document.getElementById('btnFontInc');
            const fontSizeDisplay = document.getElementById('fontSizeDisplay');
            const contentElements = document.querySelectorAll('.insight-content');
            
            // 字體級別設定
            let currentSizeIndex = 2; // 預設適中
            const fontSizes = [
                { label: '小', class: 'text-sm' },
                { label: '標準', class: 'text-base' },
                { label: '適中', class: 'text-lg md:text-xl' },
                { label: '放大', class: 'text-xl md:text-2xl' },
                { label: '特大', class: 'text-2xl md:text-3xl' }
            ];

            function applyFontSize() {
                contentElements.forEach(el => {
                    // 移除舊的字體 class
                    fontSizes.forEach(size => {
                        size.class.split(' ').forEach(c => el.classList.remove(c));
                    });
                    // 加入新的字體 class
                    fontSizes[currentSizeIndex].class.split(' ').forEach(c => el.classList.add(c));
                });
                fontSizeDisplay.textContent = fontSizes[currentSizeIndex].label;
                // 字體改變後高度會變，重新量測折疊狀態
                if (collapseReady) cards.forEach(evaluateCollapse);
            }

            fontDec.addEventListener('click', () => {
                if (currentSizeIndex > 0) {
                    currentSizeIndex--;
                    applyFontSize();
                }
            });

            fontInc.addEventListener('click', () => {
                if (currentSizeIndex < fontSizes.length - 1) {
                    currentSizeIndex++;
                    applyFontSize();
                }
            });

            // 折疊功能狀態旗標 (需在 applyFontSize 首次呼叫前宣告)
            let collapseReady = false;

            // 初始化字體大小
            applyFontSize();

            // --- 折疊過長心得功能 (預設折疊，點擊展開) ---
            const COLLAPSE_MAX = 200; // px，折疊時顯示的高度

            // 建立包裝層與展開/收合按鈕 (只建立一次)，並量測是否需要折疊
            function setupCollapse(card) {
                const content = card.querySelector('.insight-content');
                if (!content) return;
                let wrap = card.querySelector('.collapse-wrap');
                if (!wrap) {
                    wrap = document.createElement('div');
                    wrap.className = 'collapse-wrap relative overflow-hidden transition-[max-height] duration-300';
                    content.parentNode.insertBefore(wrap, content);
                    wrap.appendChild(content);

                    const fade = document.createElement('div');
                    fade.className = 'collapse-fade pointer-events-none absolute inset-x-0 bottom-0 h-16 bg-gradient-to-t from-morandi-card to-transparent';
                    wrap.appendChild(fade);

                    const btn = document.createElement('button');
                    btn.className = 'toggle-btn mt-3 inline-flex items-center gap-1 text-sm md:text-base font-medium text-morandi-blue hover:text-morandi-slate transition-colors';
                    wrap.parentNode.insertBefore(btn, wrap.nextSibling);
                    btn.addEventListener('click', () => {
                        card.classList.toggle('expanded');
                        applyCollapseState(card);
                    });
                }
                evaluateCollapse(card);
            }

            // 量測完整高度，決定是否需要折疊
            function evaluateCollapse(card) {
                if (card.offsetParent === null) return; // 隱藏中的卡片不量測
                const wrap = card.querySelector('.collapse-wrap');
                const content = card.querySelector('.insight-content');
                const btn = card.querySelector('.toggle-btn');
                const fade = card.querySelector('.collapse-fade');
                wrap.style.maxHeight = 'none'; // 先解除限制以量測
                const full = content.scrollHeight;
                if (full > COLLAPSE_MAX + 40) {
                    card.dataset.collapsible = 'true';
                    btn.classList.remove('hidden');
                    applyCollapseState(card);
                } else {
                    card.dataset.collapsible = 'false';
                    card.classList.remove('expanded');
                    btn.classList.add('hidden');
                    fade.classList.add('hidden');
                    wrap.style.maxHeight = 'none';
                }
            }

            // 套用目前展開/折疊狀態
            function applyCollapseState(card) {
                if (card.dataset.collapsible !== 'true') return;
                const wrap = card.querySelector('.collapse-wrap');
                const content = card.querySelector('.insight-content');
                const btn = card.querySelector('.toggle-btn');
                const fade = card.querySelector('.collapse-fade');
                const chevronDown = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"></path></svg>';
                const chevronUp = '<svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M5 15l7-7 7 7"></path></svg>';
                if (card.classList.contains('expanded')) {
                    wrap.style.maxHeight = content.scrollHeight + 'px';
                    fade.classList.add('hidden');
                    btn.innerHTML = '收合' + chevronUp;
                } else {
                    wrap.style.maxHeight = COLLAPSE_MAX + 'px';
                    fade.classList.remove('hidden');
                    btn.innerHTML = '展開閱讀全文' + chevronDown;
                }
            }

            cards.forEach(setupCollapse);
            collapseReady = true;

            // --- 篩選與動畫邏輯 (書卷 + 月份雙重篩選) ---
            let currentBook = 'all';
            let currentDate = 'all';

            function performFilter() {
                let foundAny = false;

                // 計算目前月份底下，哪些書卷還有心得
                const availableBooks = new Set();
                cards.forEach(card => {
                    const cardDate = card.getAttribute('data-date');
                    if (currentDate === 'all' || cardDate === currentDate) {
                        availableBooks.add(card.getAttribute('data-book'));
                    }
                });

                // 若目前選中的書卷在這個月份底下沒有資料，自動退回「顯示全部」
                if (currentBook !== 'all' && !availableBooks.has(currentBook)) {
                    currentBook = 'all';
                }

                // 讓「匯出 PDF」連結帶上目前的書卷與月份範圍
                const pdfLink = document.getElementById('pdfExportLink');
                if (pdfLink) {
                    const qs = new URLSearchParams();
                    if (currentBook !== 'all') qs.set('book', currentBook);
                    if (currentDate !== 'all') qs.set('date', currentDate);
                    const qsStr = qs.toString();
                    pdfLink.href = 'print.html' + (qsStr ? '?' + qsStr : '');
                }

                // 更新月份按鈕樣式
                dateBtns.forEach(btn => {
                    const target = btn.getAttribute('data-date');
                    if (target === currentDate) {
                        btn.className = "date-btn px-4 py-1.5 rounded-full text-base md:text-lg font-medium bg-morandi-text text-white transition-all shadow-sm";
                    } else {
                        btn.className = "date-btn px-4 py-1.5 rounded-full text-base md:text-lg font-medium bg-white text-morandi-muted hover:bg-morandi-text hover:text-white transition-all shadow-sm";
                    }
                });

                // 更新 Tag Pilling 按鈕樣式；沒有資料的書卷變灰並鎖住點擊
                tagBtns.forEach(btn => {
                    const target = btn.getAttribute('data-target');
                    const disabled = target !== 'all' && !availableBooks.has(target);
                    btn.disabled = disabled;
                    if (disabled) {
                        btn.className = "tag-btn px-4 py-1.5 rounded-full text-base md:text-lg font-medium bg-stone-100 text-stone-300 cursor-not-allowed transition-all shadow-sm";
                    } else if (target === currentBook) {
                        btn.className = "tag-btn px-4 py-1.5 rounded-full text-base md:text-lg font-medium bg-morandi-blue text-white transition-all shadow-sm";
                    } else {
                        btn.className = "tag-btn px-4 py-1.5 rounded-full text-base md:text-lg font-medium bg-white text-morandi-muted hover:bg-stone-200/50 transition-all shadow-sm";
                    }
                });

                // 同步下拉選單：鎖住沒有資料的書卷
                Array.from(bookSelect.options).forEach(opt => {
                    if (opt.value === 'all') return;
                    opt.disabled = !availableBooks.has(opt.value);
                });
                bookSelect.value = currentBook;

                // 過濾卡片 (書卷 + 月份 需同時符合)
                cards.forEach(card => {
                    const cardBook = card.getAttribute('data-book');
                    const cardDate = card.getAttribute('data-date');
                    const matchBook = currentBook === 'all' || cardBook === currentBook;
                    const matchDate = currentDate === 'all' || cardDate === currentDate;
                    if (matchBook && matchDate) {
                        card.style.display = 'block';
                        // 使用 RequestAnimationFrame 來保證過渡動畫觸發成功
                        requestAnimationFrame(() => {
                            card.style.opacity = '1';
                            card.style.transform = 'translateY(0)';
                        });
                        foundAny = true;
                    } else {
                        card.style.opacity = '0';
                        card.style.transform = 'translateY(12px)';
                        // 動畫播完後再 hidden
                        setTimeout(() => {
                            const stillMatchBook = currentBook === 'all' || cardBook === currentBook;
                            const stillMatchDate = currentDate === 'all' || cardDate === currentDate;
                            if (!(stillMatchBook && stillMatchDate)) {
                                card.style.display = 'none';
                            }
                        }, 400);
                    }
                });

                // 處理無資料情形
                setTimeout(() => {
                    if (!foundAny) {
                        noResults.classList.remove('hidden');
                        noResults.style.opacity = '1';
                    } else {
                        noResults.classList.add('hidden');
                    }
                }, 400);
            }

            // 選單事件
            bookSelect.addEventListener('change', (e) => {
                currentBook = e.target.value;
                performFilter();
            });

            // 標籤列按鈕點擊事件
            tagBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    if (btn.disabled) return;
                    currentBook = btn.getAttribute('data-target');
                    performFilter();
                });
            });

            // 月份按鈕點擊事件
            dateBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    currentDate = btn.getAttribute('data-date');
                    performFilter();
                });
            });

            // --- 複製功能邏輯 (防 iframe 沙盒限制相容法) ---
            const copyBtns = document.querySelectorAll('.copy-btn');
            const toast = document.getElementById('toastMessage');
            const toastText = document.getElementById('toastText');

            // 純文字複製 (備用法，確保 iframe 環境下依舊 100% 成功)
            function copyText(text) {
                const textArea = document.createElement('textarea');
                textArea.value = text;
                textArea.style.position = 'fixed';
                textArea.style.opacity = '0';
                document.body.appendChild(textArea);
                textArea.select();
                let ok = false;
                try {
                    ok = document.execCommand('copy');
                } catch (err) {
                    console.error('複製失敗:', err);
                }
                document.body.removeChild(textArea);
                return ok;
            }

            copyBtns.forEach(btn => {
                btn.addEventListener('click', () => {
                    const card = btn.closest('.insight-card');
                    const title = card.querySelector('.card-title').textContent;
                    const content = card.querySelector('.insight-content').textContent;
                    const fullText = `【${title}】\n${content}`;
                    if (copyText(fullText)) {
                        showToast('內容已成功複製至剪貼簿');
                    }
                });
            });

            // --- 分享功能邏輯 (產生帶有錨點的網址，可分享單篇心得) ---
            // 為每張卡片產生穩定的網址識別碼 (依書卷與標題，重複者加序號)
            const slugCount = {};
            function makeSlug(card) {
                const title = card.querySelector('.card-title').textContent.trim();
                let base = encodeURIComponent(title.replace(/\s+/g, '-'));
                slugCount[base] = (slugCount[base] || 0) + 1;
                if (slugCount[base] > 1) base += '-' + slugCount[base];
                return base;
            }

            // --- 導讀 (百度語音 TTS) 功能 ---
            // 透過百度翻譯隱藏的 gettts 端點取得 mp3 音訊，用 <audio> 播放。
            // 該端點對單次文字長度有限制，故將心得內容切成短句後依序播放。
            const ttsSupported = true; // 改用 <audio> 播放，瀏覽器皆支援
            let currentSpeakBtn = null;
            let ttsAudio = null;       // 目前播放中的 Audio
            let ttsToken = 0;          // 序號：停止/切換時讓進行中的播放鏈失效
            const speakIconPlay = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.114 5.636a9 9 0 010 12.728M16.463 8.288a5.25 5.25 0 010 7.424M6.75 8.25l4.72-4.72a.75.75 0 011.28.53v15.88a.75.75 0 01-1.28.53l-4.72-4.72H4.51c-.88 0-1.704-.507-1.938-1.354A9.01 9.01 0 012.25 12c0-.83.112-1.633.322-2.396C2.806 8.756 3.63 8.25 4.51 8.25H6.75z"></path></svg>';
            const speakIconStop = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.25 7.5A2.25 2.25 0 017.5 5.25h9a2.25 2.25 0 012.25 2.25v9a2.25 2.25 0 01-2.25 2.25h-9a2.25 2.25 0 01-2.25-2.25v-9z"></path></svg>';

            // 百度語音端點：spd 語速(1-9)，lan=zh 中文
            function buildBaiduUrl(text) {
                return 'https://fanyi.baidu.com/gettts?lan=zh&spd=3&source=web&text=' + encodeURIComponent(text);
            }

            // 將長文字依標點切成短句 (每段控制在約 80 字以內)
            function splitText(text) {
                const clean = text.replace(/\s+/g, '');
                const sentences = clean.split(/(?<=[。！？；，、,.!?;])/);
                const chunks = [];
                let buf = '';
                for (const s of sentences) {
                    if (!s) continue;
                    if ((buf + s).length > 80) {
                        if (buf) { chunks.push(buf); buf = ''; }
                        if (s.length > 80) {
                            for (let i = 0; i < s.length; i += 80) chunks.push(s.slice(i, i + 80));
                        } else {
                            buf = s;
                        }
                    } else {
                        buf += s;
                    }
                }
                if (buf) chunks.push(buf);
                return chunks;
            }

            function setSpeakBtnState(btn, speaking) {
                btn.innerHTML = speaking
                    ? speakIconStop + '<span class="btn-label">停止</span>'
                    : speakIconPlay + '<span class="btn-label">導讀</span>';
            }

            function stopSpeaking() {
                ttsToken++; // 讓進行中的播放鏈失效
                if (ttsAudio) {
                    ttsAudio.pause();
                    ttsAudio.src = '';
                    ttsAudio = null;
                }
                if (currentSpeakBtn) {
                    setSpeakBtnState(currentSpeakBtn, false);
                    currentSpeakBtn = null;
                }
            }

            // 依序播放每一段音訊
            function playChunks(chunks, idx, btn, myToken) {
                if (myToken !== ttsToken) return; // 已被停止或被其他心得取代
                if (idx >= chunks.length) {        // 全部播完
                    if (currentSpeakBtn === btn) {
                        setSpeakBtnState(btn, false);
                        currentSpeakBtn = null;
                    }
                    return;
                }
                // 先建立空的 Audio 並設 no-referrer，再指定 src。
                // 百度端點會檢查 Referer：帶 referer (如 GitHub Pages) 時只回傳極小的空音檔，
                // 設為 no-referrer (模擬 file:// 不送 Referer) 才能正常取得語音。
                // 注意：不要設 crossOrigin，否則會變成 CORS 請求而被百度擋下。
                const audio = new Audio();
                audio.referrerPolicy = 'no-referrer';
                ttsAudio = audio;
                audio.src = buildBaiduUrl(chunks[idx]);
                audio.onended = () => playChunks(chunks, idx + 1, btn, myToken);
                audio.onerror = () => playChunks(chunks, idx + 1, btn, myToken); // 某段失敗就跳過
                audio.play().catch(() => {
                    // 瀏覽器擋自動播放：提示使用者
                    showToast('請先點一下畫面，再按導讀');
                    if (myToken === ttsToken && currentSpeakBtn === btn) {
                        setSpeakBtnState(btn, false);
                        currentSpeakBtn = null;
                    }
                });
            }

            function speakCard(card, btn) {
                // 再次點擊正在朗讀的按鈕 → 停止
                if (currentSpeakBtn === btn) {
                    stopSpeaking();
                    return;
                }
                stopSpeaking(); // 先停止其他正在朗讀的心得
                const text = card.querySelector('.insight-content').textContent.trim();
                if (!text) return;
                const chunks = splitText(text);
                if (!chunks.length) return;
                currentSpeakBtn = btn;
                setSpeakBtnState(btn, true);
                const myToken = ++ttsToken;
                playChunks(chunks, 0, btn, myToken);
            }

            // 離開頁面時停止朗讀
            window.addEventListener('beforeunload', stopSpeaking);

            cards.forEach(card => {
                const id = 'note-' + makeSlug(card);
                card.id = id;

                // 為複製按鈕補上文字說明 (方便長輩辨識)
                const copyBtn = card.querySelector('.copy-btn');
                copyBtn.className = 'copy-btn inline-flex items-center gap-1 text-base md:text-lg text-stone-500 hover:text-morandi-blue px-2 py-1 rounded-lg hover:bg-stone-100 transition-colors';
                if (!copyBtn.querySelector('.btn-label')) {
                    copyBtn.insertAdjacentHTML('beforeend', '<span class="btn-label">複製</span>');
                }

                // 動態插入分享按鈕 (置於複製按鈕旁，附文字說明)
                const shareBtn = document.createElement('button');
                shareBtn.className = 'share-btn inline-flex items-center gap-1 text-base md:text-lg text-stone-500 hover:text-morandi-sage px-2 py-1 rounded-lg hover:bg-stone-100 transition-colors';
                shareBtn.title = '分享此篇心得';
                shareBtn.innerHTML = '<svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg><span class="btn-label">分享</span>';

                shareBtn.addEventListener('click', async () => {
                    const title = card.querySelector('.card-title').textContent.trim();
                    const url = location.origin + location.pathname + '?note=' + encodeURIComponent(id);
                    // 行動裝置優先使用原生分享 (可分享到 LINE、訊息等)
                    if (navigator.share) {
                        try {
                            await navigator.share({ title: '頌主堂讀經心得', text: `頌主堂讀經心得\n與你分享這篇心得：${title}`, url });
                            return;
                        } catch (err) {
                            if (err && err.name === 'AbortError') return; // 使用者取消
                        }
                    }
                    // 退而求其次：複製分享連結
                    if (copyText(url)) {
                        showToast('分享連結已複製，可貼給親友');
                    }
                });

                // 動態插入導讀按鈕 (語音朗讀心得內容)
                let speakBtn = null;
                if (ttsSupported) {
                    speakBtn = document.createElement('button');
                    speakBtn.className = 'speak-btn inline-flex items-center gap-1 text-base md:text-lg text-stone-500 hover:text-morandi-ochre px-2 py-1 rounded-lg hover:bg-stone-100 transition-colors';
                    speakBtn.title = '朗讀這篇心得';
                    setSpeakBtnState(speakBtn, false);
                    speakBtn.addEventListener('click', () => speakCard(card, speakBtn));
                }

                // 將導讀、複製、分享按鈕包成一組，移到標題下方獨立一行
                // (避免在手機上與標題擠在同一列導致標題被壓縮變形)
                const header = copyBtn.parentNode; // 標題列
                const btnGroup = document.createElement('div');
                btnGroup.className = 'flex flex-wrap items-center gap-2 mt-3';
                if (speakBtn) btnGroup.appendChild(speakBtn);
                btnGroup.appendChild(copyBtn);
                btnGroup.appendChild(shareBtn);
                header.parentNode.insertBefore(btnGroup, header.nextSibling);
            });

            // 載入時若網址帶有 ?note= 參數，捲動並標示對應心得
            function focusSharedNote() {
                const params = new URLSearchParams(location.search);
                const noteId = params.get('note');
                if (!noteId) return;
                const target = document.getElementById(noteId);
                if (!target) return;
                // 確保該卡片顯示 (切回「顯示全部」)
                currentBook = 'all';
                currentDate = 'all';
                performFilter();
                setTimeout(() => {
                    // 若該篇為折疊狀態，分享開啟時自動展開
                    if (target.dataset.collapsible === 'true' && !target.classList.contains('expanded')) {
                        target.classList.add('expanded');
                        applyCollapseState(target);
                    }
                    target.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    target.classList.add('ring-2', 'ring-morandi-sage', 'ring-offset-2', 'ring-offset-morandi-bg');
                    setTimeout(() => {
                        target.classList.remove('ring-2', 'ring-morandi-sage', 'ring-offset-2', 'ring-offset-morandi-bg');
                    }, 3000);
                }, 200);
            }
            focusSharedNote();

            function showToast(message) {
                if (message) toastText.textContent = message;
                toast.classList.remove('opacity-0', 'translate-y-20');
                toast.classList.add('opacity-100', 'translate-y-0');
                setTimeout(() => {
                    toast.classList.remove('opacity-100', 'translate-y-0');
                    toast.classList.add('opacity-0', 'translate-y-20');
                }, 2500);
            }

        }
    </script>
</body>
</html>
